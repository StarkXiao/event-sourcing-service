services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventstore"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/eventstore?sslmode=disable
      HTTP_ADDR: :8080
      ADMIN_TOKEN: change-me
      AUTO_MIGRATE: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
